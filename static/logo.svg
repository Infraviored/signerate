<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Signerate Logo</title>
  <desc>An industrial name-plate sign in the moment of assembly: the letters S-I-G are seated on an ink-black 3D-printed plate while a signal-yellow N snaps into its recessed slot.</desc>

  <!-- ===================================================================== -->
  <!-- 1. WORKBENCH TRAY / MOUNTING BACKING                                  -->
  <!-- Ensures high contrast on both Enamel Grey (#D6D8D2) and Anthracite    -->
  <!-- (#2F3538) backgrounds while framing the sign like a machine jig.      -->
  <!-- ===================================================================== -->
  <rect x="28" y="100" width="436" height="316" rx="28" fill="#E9EAE5" stroke="#1B2023" stroke-width="12" stroke-linejoin="round" />

  <!-- Corner alignment datum ticks on the tray (workshop jig precision) -->
  <path d="M 52 144 V 124 H 72
           M 52 372 V 392 H 72
           M 440 372 V 392 H 420" fill="none" stroke="#D6D8D2" stroke-width="6" stroke-linecap="square" />

  <!-- ===================================================================== -->
  <!-- 2. MAIN SIGN PLATE (3D-PRINTED EXTRUDED BASE + HARD DROP SHADOW)      -->
  <!-- ===================================================================== -->
  <!-- Hard-edged offset drop shadow -->
  <rect x="64" y="148" width="388" height="244" rx="18" fill="#1B2023" />

  <!-- Main sign body (Ink #1B2023 with Anthracite top face #2F3538) -->
  <rect x="52" y="136" width="388" height="244" rx="18" fill="#1B2023" stroke="#1B2023" stroke-width="8" stroke-linejoin="round" />

  <!-- Raised perimeter sign border: Left/Bottom/Top-Left seated in place -->
  <path d="M 316 156 H 80 A 8 8 0 0 0 72 164 V 352 A 8 8 0 0 0 80 360 H 412 A 8 8 0 0 0 420 352 V 296" fill="none" stroke="#E9EAE5" stroke-width="12" stroke-linecap="square" stroke-linejoin="round" />

  <!-- Unfinished / recessed border channel in the assembly zone (top-right) -->
  <path d="M 332 156 H 412 A 8 8 0 0 1 420 164 V 280" fill="none" stroke="#2F3538" stroke-width="12" stroke-linecap="square" stroke-linejoin="round" stroke-dasharray="16 12" />

  <!-- ===================================================================== -->
  <!-- 3. SEATED LETTERS: "S", "I", "G" (BARLOW CONDENSED / HIGHWAY SIGNAGE) -->
  <!-- All converted to crisp engineered vector paths in Light Grey #E9EAE5  -->
  <!-- ===================================================================== -->

  <!-- Letter "S" (x: 96..164, y: 190..326) -->
  <path d="M 164 222
           V 210
           A 20 20 0 0 0 144 190
           H 116
           A 20 20 0 0 0 96 210
           V 238
           A 20 20 0 0 0 112 257
           L 140 265
           A 6 6 0 0 1 144 271
           V 300
           A 6 6 0 0 1 138 306
           H 122
           A 6 6 0 0 1 116 300
           V 290
           H 96
           V 306
           A 20 20 0 0 0 116 326
           H 144
           A 20 20 0 0 0 164 306
           V 270
           A 20 20 0 0 0 148 251
           L 120 243
           A 6 6 0 0 1 116 237
           V 216
           A 6 6 0 0 1 122 210
           H 138
           A 6 6 0 0 1 144 216
           V 222
           Z" fill="#E9EAE5" />

  <!-- Letter "I" (x: 184..208, y: 190..326) -->
  <rect x="184" y="190" width="24" height="136" rx="3" fill="#E9EAE5" />

  <!-- Letter "G" (x: 228..298, y: 190..326) -->
  <path d="M 298 226
           V 210
           A 20 20 0 0 0 278 190
           H 248
           A 20 20 0 0 0 228 210
           V 306
           A 20 20 0 0 0 248 326
           H 278
           A 20 20 0 0 0 298 306
           V 252
           H 262
           V 272
           H 276
           V 300
           A 6 6 0 0 1 270 306
           H 256
           A 6 6 0 0 1 250 300
           V 216
           A 6 6 0 0 1 256 210
           H 270
           A 6 6 0 0 1 276 216
           V 226
           Z" fill="#E9EAE5" />

  <!-- ===================================================================== -->
  <!-- 4. RECESSED TARGET SOCKET FOR "N" ON THE SIGN PLATE                   -->
  <!-- Shows the empty 3D-printed toolpath pocket awaiting the final letter. -->
  <!-- ===================================================================== -->
  <path d="M 320 326
           V 190
           H 342
           L 370 268
           V 190
           H 392
           V 326
           H 370
           L 342 248
           V 326
           Z" fill="#2F3538" stroke="#D6D8D2" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6" />

  <!-- Precision insertion trajectory guides (Signal Yellow #F5C400) -->
  <line x1="320" y1="190" x2="352" y2="128" stroke="#F5C400" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10" />
  <line x1="392" y1="326" x2="444" y2="254" stroke="#F5C400" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10" />

  <!-- ===================================================================== -->
  <!-- 5. FLYING / ASSEMBLING LETTER "N" + CORNER FRAME SEGMENT              -->
  <!-- Signal Yellow (#F5C400) for the active/new component snapping in.     -->
  <!-- ===================================================================== -->
  <g transform="translate(46, -54) rotate(11, 356, 258)">
    <!-- Detached top-right frame corner flying in with the letter -->
    <path d="M 324 148 H 416 A 10 10 0 0 1 426 158 V 246" fill="none" stroke="#1B2023" stroke-width="24" stroke-linecap="square" stroke-linejoin="round" />
    <path d="M 324 148 H 416 A 10 10 0 0 1 426 158 V 246" fill="none" stroke="#F5C400" stroke-width="12" stroke-linecap="square" stroke-linejoin="round" />

    <!-- Hard-edged 3D extrusion / shadow under the flying "N" -->
    <path d="M 310 338
             V 194
             A 4 4 0 0 1 314 190
             H 336
             A 4 4 0 0 1 340 193
             L 368 271
             V 194
             A 4 4 0 0 1 372 190
             H 392
             A 4 4 0 0 1 396 194
             V 338
             A 4 4 0 0 1 392 342
             H 370
             A 4 4 0 0 1 366 339
             L 338 261
             V 338
             A 4 4 0 0 1 334 342
             H 314
             A 4 4 0 0 1 310 338
             Z" fill="#1B2023" transform="translate(-10, 12)" />

    <!-- Signal Yellow "N" with heavy Ink outline (#1B2023) -->
    <path d="M 310 332
             V 194
             A 4 4 0 0 1 314 190
             H 336
             A 4 4 0 0 1 340 193
             L 368 271
             V 194
             A 4 4 0 0 1 372 190
             H 392
             A 4 4 0 0 1 396 194
             V 332
             A 4 4 0 0 1 392 336
             H 370
             A 4 4 0 0 1 366 333
             L 338 255
             V 332
             A 4 4 0 0 1 334 336
             H 314
             A 4 4 0 0 1 310 332
             Z" fill="#F5C400" stroke="#1B2023" stroke-width="8" stroke-linejoin="round" />
  </g>
</svg>