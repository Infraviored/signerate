{% extends "base.html" %}
{% block title %}Sign sets - Signerate{% endblock %}
{% block body %}
<header class="topbar">
  <h1 class="wordmark"><img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="">Signerate</h1>
  <button class="btn btn-signal" id="new-set-btn" type="button">New set</button>
</header>
<main class="shelves" id="set-grid"></main>

<dialog id="wizard">
  <div id="wizard-step1">
    <h2>Start from</h2>
    <div class="wizard-options" id="wizard-options"></div>
    <label class="check-row" id="copy-signs-row" hidden>
      <input type="checkbox" id="copy-signs"> Copy its signs too
    </label>
    <div class="dialog-actions">
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn btn-ink" type="button" id="wizard-next">Next</button>
    </div>
  </div>
  <div id="wizard-step2" hidden>
    <h2>Name and size</h2>
    <div class="field">
      <label for="wizard-name">Name</label>
      <input type="text" id="wizard-name" maxlength="60" autocomplete="off">
      <div class="field-error" id="wizard-name-error"></div>
    </div>
    <div class="wizard-preview" id="wizard-preview"></div>
    <div id="wizard-form"></div>
    <div class="dialog-actions">
      <button class="btn push-left" type="button" id="wizard-back">Back</button>
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn btn-ink" type="button" id="wizard-create">Create set</button>
    </div>
  </div>
</dialog>

<dialog id="delete-dialog">
  <h2>Delete this set?</h2>
  <p id="delete-text" class="muted"></p>
  <div class="dialog-actions">
    <button class="btn" type="button" data-close>Cancel</button>
    <button class="btn btn-danger" type="button" id="delete-confirm">Delete set</button>
  </div>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/overview.js') }}"></script>
{% endblock %}
