{% extends "base.html" %}
{% block title %}{{ name }} - Signerate{% endblock %}
{% block body %}
<div class="editor" id="editor" data-set-name="{{ name }}">
  <header class="topbar">
    <a class="back-link" href="/" aria-label="All sets"><svg class="back-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt=""><span class="back-text">All sets</span></a>
    <div class="set-name-wrap">
      <input type="text" class="set-name-input" id="set-name" maxlength="60" autocomplete="off" aria-label="Set name">
      <div class="name-error" id="name-error" hidden></div>
    </div>
    <span class="summary" id="summary"></span>
    <span class="save-state" id="save-state"></span>
    <button class="btn btn-on-dark" type="button" id="open-panel" aria-pressed="false">Size &amp; style</button>
  </header>

  <div class="workbench">
    <div class="workspace" id="workspace">
      <div class="banner danger" id="thickness-banner" hidden></div>
      <div class="banner" id="changed-banner" hidden>
        <span>Size or style changed since the last export</span>
        <button class="btn" type="button" id="changed-renew">Mark all as new</button>
      </div>

      <div class="sign-row add-row">
        <div class="plate-slot" id="add-preview"></div>
        <input type="text" class="sign-input" id="add-input" placeholder="Type a new sign" autocomplete="off" maxlength="200" aria-label="Type a new sign">
      </div>

      <div class="tray" id="sign-list"></div>

      <footer class="export-bar">
        <div class="progress" id="progress" hidden><div class="progress-bar" id="progress-bar"></div></div>
        <div class="export-controls">
          <div class="segmented" id="scope" role="group" aria-label="Which signs to export">
            <button type="button" data-scope="new"></button>
            <button type="button" data-scope="all"></button>
          </div>
          <div class="segmented" id="format" role="group" aria-label="File format">
            <button type="button" data-format="3mf" title="For Bambu and Prusa slicers">3MF</button>
            <button type="button" data-format="step" title="For CAD editing">STEP</button>
          </div>
          <div class="segmented" id="destination" role="group" aria-label="Where to put the file" hidden>
            <button type="button" data-destination="download">Download</button>
            <button type="button" data-destination="nextcloud">Nextcloud</button>
          </div>
          <div class="export-status" id="export-status" hidden></div>
          <button class="btn btn-signal btn-export" type="button" id="export-btn"></button>
        </div>
      </footer>
    </div>

    <aside class="panel" id="panel" aria-label="Size and style" hidden>
      <div class="panel-head">
        <h2>Size &amp; style</h2>
        <button class="icon-btn" type="button" id="close-panel" aria-label="Close"></button>
      </div>
      <div class="panel-body">
        <div id="panel-form"></div>
        <h3 class="form-section">Current text size</h3>
        <div class="stats" id="stats"></div>
      </div>
    </aside>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
